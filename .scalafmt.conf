version = 3.8.3

# This repo mixes Scala 2.12 and Scala 3.4 sources across exercises. The Scala 3
# dialect parses Scala 2 as well, so it is the default; the one file relying on
# Scala 2-only procedure syntax is pinned to the Scala 2.12 dialect below.
runner.dialect = scala3

maxColumn = 100

align.preset = none
align.tokens = []

danglingParentheses.preset = false
danglingParentheses.exclude = []

docstrings.style = keep
docstrings.wrap = keep

newlines.source = keep
newlines.topLevelStatementBlankLines = []

indent.main = 2
indent.significant = 2
indent.callSite = 2
indent.defnSite = 2

# Only whitespace/layout is normalised; no automatic rewrites or import sorting.
rewrite.rules = []

project.excludePaths = [
  "glob:**/target/**",
  "glob:**/.bloop/**",
  "glob:**/.metals/**",
  "glob:**/.exercism/**",
  # Exercism ships the tests for every exercise, so they are treated as
  # platform data and left exactly as downloaded, mirroring how the Python
  # track excludes its *_test.py files from formatting.
  "glob:**/src/test/**",
]

