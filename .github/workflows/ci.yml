name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install scalafmt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:11
          apps: scalafmt

      - name: Check Scala formatting
        run: ./format.sh --check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The exercises pin sbt 1.2.x, whose launcher relies on the Security
      # Manager removed in later JDKs, so the suite runs on JDK 11.
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:11
          apps: sbt

      - name: Cache sbt and Coursier artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/build.properties', '**/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build and run all exercise tests
        run: ./ci-test.sh
